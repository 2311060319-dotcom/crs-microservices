# path: auth-service/src/main/resources/application.properties
# purpose: cau hinh cong, database va JWT secret cho auth-service

spring.application.name=auth-service

server.port=8081

# MySQL 3306 (cong that cua may ban), tu tao auth_db neu chua co
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# QUAN TRONG: chuoi bi mat nay phai GIONG HET nhau o auth-service, course-service, registration-service
jwt.secret=CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te
jwt.expiration-ms=86400000
